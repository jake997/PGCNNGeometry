[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgcnn"
version = "0.1.0"
description = "Polynomial Group-Convolutional Neural Networks analysis tools"
authors = [
    {name="Yacoub Hendi"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

dependencies = [
]

keywords = ["algebraic-geometry", "group-convolution", "sage", "macaulay2"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]